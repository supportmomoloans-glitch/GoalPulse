name: Build GoalPulse Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Prepare Signing Keystore
        id: setup_keystore
        run: |
          mkdir -p android/app/keystore
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using production signing keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore/release.jks
            echo "HAS_CUSTOM_KEYSTORE=true" >> $GITHUB_OUTPUT
          else
            echo "No custom keystore found in GitHub Secrets. Generating self-signed signing key for test installation..."
            keytool -genkeypair -v \
              -keystore android/app/keystore/release.jks \
              -alias "${{ secrets.KEY_ALIAS || 'goalpulse' }}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${{ secrets.KEYSTORE_PASSWORD || 'goalpulse123' }}" \
              -keypass "${{ secrets.KEY_PASSWORD || 'goalpulse123' }}" \
              -dname "CN=GoalPulse, OU=Sports, O=GoalPulse, L=Nairobi, ST=Nairobi, C=KE"
            echo "HAS_CUSTOM_KEYSTORE=false" >> $GITHUB_OUTPUT
          fi

      - name: Assemble Android APK
        env:
          RELEASE_STORE_FILE: keystore/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'goalpulse123' }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'goalpulse' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'goalpulse123' }}
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug --no-daemon \
            -PRELEASE_STORE_FILE=keystore/release.jks \
            -PRELEASE_STORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD || 'goalpulse123' }}" \
            -PRELEASE_KEY_ALIAS="${{ secrets.KEY_ALIAS || 'goalpulse' }}" \
            -PRELEASE_KEY_PASSWORD="${{ secrets.KEY_PASSWORD || 'goalpulse123' }}"

      - name: Prepare APK Artifacts for Download
        run: |
          mkdir -p release-apks
          if ls android/app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            cp android/app/build/outputs/apk/release/*.apk release-apks/GoalPulse-release.apk
          fi
          if ls android/app/build/outputs/apk/debug/*.apk 1> /dev/null 2>&1; then
            cp android/app/build/outputs/apk/debug/*.apk release-apks/GoalPulse-debug.apk
          fi
          echo "Generated APKs:"
          ls -la release-apks/

      - name: Upload APKs as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoalPulse-Android-APKs
          path: release-apks/*.apk
          retention-days: 30
