name: Build GoalPulse Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Prepare Platform
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Prepare Signing Keystore
        run: |
          mkdir -p android/app/keystore
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using custom keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore/release.jks
          else
            echo "Generating self-signed release key for instant installation..."
            keytool -genkeypair -v \
              -keystore android/app/keystore/release.jks \
              -alias "goalpulse" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "goalpulse123" \
              -keypass "goalpulse123" \
              -dname "CN=GoalPulse, OU=Sports, O=GoalPulse, L=Nairobi, ST=Nairobi, C=KE"
          fi

      - name: Build Android APKs
        run: |
          cd android
          ./gradlew assembleDebug -x lint -x test --no-daemon --stacktrace
          ./gradlew assembleRelease -x lint -x lintVitalRelease -x test --no-daemon --stacktrace || true

      - name: Collect APK Artifacts
        run: |
          mkdir -p release-apks
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} release-apks/ \;
          echo "Collected APK files:"
          ls -la release-apks/

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoalPulse-Android-APKs
          path: release-apks/*.apk
          retention-days: 30
