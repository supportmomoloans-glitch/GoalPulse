name: Build GoalPulse Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Verify Environment & Assets
        run: |
          echo "=== Node Version ==="
          node -v
          echo "=== Java Version ==="
          java -version
          echo "=== Verifying Required Directories ==="
          test -d android/app/src/main/assets/public || (echo "ERROR: android/app/src/main/assets/public does not exist!" && exit 1)
          test -d android/capacitor-cordova-android-plugins || (echo "ERROR: android/capacitor-cordova-android-plugins does not exist!" && exit 1)
          ls -la android/app/src/main/assets/public
          ls -la android/capacitor-cordova-android-plugins
          echo "=== Gradle Version ==="
          cd android
          ./gradlew --version --console=plain

      - name: Prepare Signing Keystore
        run: |
          mkdir -p android/app/keystore
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using custom keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore/release.jks
          else
            echo "Generating signing key for release..."
            keytool -genkeypair -v \
              -keystore android/app/keystore/release.jks \
              -alias "goalpulse" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "goalpulse123" \
              -keypass "goalpulse123" \
              -dname "CN=GoalPulse, OU=Sports, O=GoalPulse, L=Nairobi, ST=Nairobi, C=KE"
          fi

      - name: Build Android APKs
        run: |
          cd android
          ./gradlew assembleDebug --console=plain
          ./gradlew assembleRelease --console=plain

      - name: Collect APK Artifacts
        run: |
          mkdir -p release-apks
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} release-apks/ \;
          echo "Collected APK files:"
          ls -la release-apks/

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoalPulse-Android-APKs
          path: release-apks/*.apk
          retention-days: 30

      - name: Create GitHub Release & Attach APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "GoalPulse Release Build #${{ github.run_number }}"
          body: |
            ## GoalPulse Android Build #${{ github.run_number }}
            
            Automated production build for GoalPulse Football app.
            
            ### Download APK:
            Download the `.apk` file below directly to your Android device to install.
          files: release-apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
